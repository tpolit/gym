<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Graphique : avant / après</title>
<style>
  @font-face { font-family: "Barlow Condensed"; font-weight: 700; src: url(fonts/barlow-condensed-700.woff2) format("woff2"); }
  body { margin: 0; padding: 24px; background: #000; color: #f5f5f7; font-family: Cantarell, sans-serif; display: flex; gap: 24px; }
  figure { margin: 0; text-align: center; }
  .crop { width: 560px; height: 300px; overflow: hidden; border-radius: 20px; border: 1px solid #303034; position: relative; }
  .crop img { position: absolute; width: 780px; left: -220px; top: -330px; }
  figcaption { margin-top: 14px; font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 30px; letter-spacing: 1px; }
  figcaption small { display: block; font-family: Cantarell, sans-serif; font-weight: 400; font-size: 16px; color: #9a9aa1; letter-spacing: 0; margin-top: 4px; }
</style></head>
<body>
  <figure><div class="crop"><img src="png/stats-avant.png"></div><figcaption>AVANT <small>petit point lilas, la courbe continue de monter après le « record »</small></figcaption></figure>
  <figure><div class="crop"><img src="png/stats.png"></div><figcaption>APRÈS <small>point abricot agrandi + halo + mention « RECORD », sur le vrai sommet</small></figcaption></figure>
</body>
</html>
