<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Stats d'un exercice</title><link rel="stylesheet" href="style.css"></head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="history" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="stats" viewBox="0 0 24 24"><path d="M3 20h18M6 16v-4M11 16V6M16 16v-7"/></symbol>
  <symbol id="dumbbell" viewBox="0 0 24 24"><path d="M6.5 6.5v11M3.5 9v6M17.5 6.5v11M20.5 9v6M6.5 12h11"/></symbol>
  <symbol id="chev-l" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="trophy" viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></symbol>
</svg>
<div class="screen">
  <div class="statusbar"><span>18:41</span><span class="icons">5G <span class="battery"></span></span></div>
  <div class="navbar">
    <span class="back"><svg class="i"><use href="#chev-l"/></svg>Stats</span>
    <span class="title"></span>
    <span class="right"></span>
  </div>

  <div class="content" style="gap:10px">
    <div class="title-l">Développé couché barre</div>
    <div class="segmented"><div class="on">1RM estimé</div><div>Poids max</div><div>Volume</div></div>

    <div class="card" style="padding:12px 8px 8px">
      <svg width="342" height="190" viewBox="0 0 342 190" style="display:block">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#0a84ff" stop-opacity=".35"/>
            <stop offset="1" stop-color="#0a84ff" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <g fill="#636366" font-size="11" font-family="inherit">
          <text x="4" y="24">105</text><text x="4" y="69">100</text><text x="10" y="114">95</text><text x="10" y="159">90</text>
          <text x="50" y="184">sept.</text><text x="160" y="184">oct.</text><text x="270" y="184">nov.</text>
        </g>
        <g stroke="#2c2c2e" stroke-width="1">
          <line x1="34" y1="20" x2="338" y2="20"/><line x1="34" y1="65" x2="338" y2="65"/>
          <line x1="34" y1="110" x2="338" y2="110"/><line x1="34" y1="155" x2="338" y2="155"/>
        </g>
        <path d="M44 146 L78 137 L112 128 L146 119 L180 101 L214 92 L248 83 L282 56 L316 47 L316 155 L44 155 Z" fill="url(#g)"/>
        <polyline points="44,146 78,137 112,128 146,119 180,101 214,92 248,83 282,56 316,47" fill="none" stroke="#0a84ff" stroke-width="2.5" stroke-linejoin="round"/>
        <g fill="#0a84ff">
          <circle cx="44" cy="146" r="3.5"/><circle cx="78" cy="137" r="3.5"/><circle cx="112" cy="128" r="3.5"/>
          <circle cx="146" cy="119" r="3.5"/><circle cx="180" cy="101" r="3.5"/><circle cx="214" cy="92" r="3.5"/>
          <circle cx="248" cy="83" r="3.5"/><circle cx="282" cy="56" r="3.5"/>
        </g>
        <circle cx="316" cy="47" r="6" fill="#ff9f0a"/>
      </svg>
    </div>
    <div class="chips"><span class="chip">1 mois</span><span class="chip active">3 mois</span><span class="chip">1 an</span><span class="chip">Tout</span></div>

    <h2 class="section">Records</h2>
    <div class="stats-grid">
      <div class="card stat"><div class="muted small">Poids max</div><div class="v">85 kg × 6</div><div class="muted xsmall">12 oct.</div></div>
      <div class="card stat"><div class="muted small" style="display:flex;gap:4px;align-items:center;color:var(--rest)"><svg class="i s"><use href="#trophy"/></svg>1RM estimé</div><div class="v">102 kg</div><div class="muted xsmall">28 oct.</div></div>
      <div class="card stat"><div class="muted small">Volume séance</div><div class="v">4 280 kg</div><div class="muted xsmall">21 oct.</div></div>
      <div class="card stat"><div class="muted small">Séances</div><div class="v">14</div><div class="muted xsmall">depuis août</div></div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab"><svg class="i"><use href="#home"/></svg>Accueil</div>
    <div class="tab"><svg class="i"><use href="#history"/></svg>Historique</div>
    <div class="tab active"><svg class="i"><use href="#stats"/></svg>Stats</div>
    <div class="tab"><svg class="i"><use href="#dumbbell"/></svg>Exercices</div>
  </div>
  <div class="home-indicator"></div>
</div>
</body>
</html>
