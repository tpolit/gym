<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Vue exercice (durée)</title><link rel="stylesheet" href="style.css"></head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="chev-l" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
</svg>
<div class="screen">
  <div class="statusbar"><span>18:52</span><span class="icons">5G <span class="battery"></span></span></div>
  <div class="navbar">
    <span class="back"><svg class="i"><use href="#chev-l"/></svg>Séance</span>
    <span class="title">5 / 5</span>
    <span class="right"></span>
  </div>

  <div class="content" style="gap:10px">
    <div>
      <div class="title-l">Gainage planche</div>
      <div style="display:flex;gap:6px;margin-top:6px"><span class="tag">Poids du corps</span><span class="tag">Abdominaux</span></div>
    </div>

    <div class="card" style="padding:12px 16px">
      <div class="muted small" style="margin-bottom:8px">Dernière fois · mar. 28 oct.</div>
      <div class="chips"><span class="chip">60 s</span><span class="chip">45 s</span></div>
    </div>

    <div class="list">
      <div class="item" style="min-height:44px;padding:10px 16px">
        <span class="muted" style="width:20px">1</span><span class="grow bold">55 s</span><span class="muted xsmall">18:49</span>
      </div>
    </div>

    <div class="stopwatch">
      <div class="muted small">Chronomètre de la série</div>
      <div class="big">0:38</div>
      <div class="round-btns">
        <div class="round reset">Remettre<br>à zéro</div>
        <div class="round stop">Arrêter</div>
      </div>
      <div class="xsmall muted">En s'arrêtant, le chrono remplit la durée ci-dessous</div>
    </div>
  </div>

  <div class="sheet">
    <div class="steppers">
      <div class="stepper">
        <div class="label">Durée</div>
        <div class="controls"><div class="pm">−</div><div><span class="value">0:38</span></div><div class="pm">+</div></div>
        <div class="hint">± 5 s</div>
      </div>
      <div class="stepper">
        <div class="label">Lest (kg)</div>
        <div class="controls"><div class="pm">−</div><div><span class="value" style="font-size:20px">Aucun</span></div><div class="pm">+</div></div>
        <div class="hint">± 0,5 kg</div>
      </div>
    </div>
    <div class="btn primary block"><svg class="i"><use href="#check"/></svg>Valider la série 2</div>
  </div>
  <div class="home-indicator"></div>
</div>
</body>
</html>
