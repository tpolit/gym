<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>v2 — Clavier de poids</title><link rel="stylesheet" href="style.css"></head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="back" viewBox="0 0 24 24"><path d="M20 6H9l-6 6 6 6h11a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1zM16 10l-4 4M12 10l4 4"/></symbol>
  <symbol id="down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
</svg>
<div class="screen">
  <div class="statusbar"><span>18:37</span><span class="icons">5G <span class="battery"></span></span></div>
  <div class="topbar">
    <span class="icon-btn"><svg class="i"><use href="#down"/></svg></span>
    <span class="display" style="font-size:18px;color:var(--text-2)">PUSH A · <span style="color:var(--text)">35:02</span></span>
    <span class="pill accent-outline">Terminer</span>
  </div>
  <div class="content">
    <div><div class="eyebrow">Exercice 2 / 5</div><div class="h2">Développé incliné haltères</div></div>
  </div>

  <div class="scrim"></div>
  <div class="sheet" style="height:600px;padding:0 16px">
    <div class="grabber"></div>
    <div class="row" style="justify-content:space-between;margin-top:14px">
      <span class="eyebrow">Série 3 · Poids</span>
      <span class="small muted">Dernière fois 27,5 kg</span>
    </div>
    <div style="text-align:center;margin:10px 0 4px">
      <span class="display" style="font-size:96px;line-height:1">32,5</span>
      <span class="display" style="font-size:32px;color:var(--text-2)"> kg</span>
    </div>
    <div class="chips" style="justify-content:center;margin-bottom:14px">
      <span class="chip">−2,5</span><span class="chip">−0,5</span><span class="chip">+0,5</span><span class="chip">+2,5</span>
    </div>
    <div class="keypad">
      <div class="key">1</div><div class="key">2</div><div class="key">3</div>
      <div class="key">4</div><div class="key">5</div><div class="key">6</div>
      <div class="key">7</div><div class="key">8</div><div class="key">9</div>
      <div class="key fn">,</div><div class="key">0</div><div class="key fn"><svg class="i l"><use href="#back"/></svg></div>
    </div>
    <div class="btn primary" style="margin-top:14px">Suivant : répétitions</div>
  </div>
  <div class="home-indicator"></div>
</div>
</body>
</html>
