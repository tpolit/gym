<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>v2 — Vue exercice</title><link rel="stylesheet" href="style.css"></head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="up" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
  <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="sliders" viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></symbol>
  <symbol id="timer" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></symbol>
</svg>
<div class="screen">
  <div class="statusbar"><span>18:36</span><span class="icons">5G <span class="battery"></span></span></div>
  <div class="topbar">
    <span class="icon-btn"><svg class="i"><use href="#down"/></svg></span>
    <span class="display" style="font-size:18px;color:var(--text-2)">PUSH A · <span style="color:var(--text)">34:12</span></span>
    <span class="pill accent-outline">Terminer</span>
  </div>

  <div class="content" style="gap:12px">
    <div>
      <div class="eyebrow">Exercice 2 / 5</div>
      <div class="h2" style="margin-top:2px">Développé incliné haltères</div>
      <div class="chips" style="margin-top:8px"><span class="chip"><svg class="i s"><use href="#sliders"/></svg>Banc cran 3</span></div>
    </div>

    <div class="rest-hero">
      <div>
        <div class="eyebrow rest" style="display:flex;gap:6px;align-items:center"><svg class="i s"><use href="#timer"/></svg>Repos</div>
        <div class="small muted" style="margin-top:4px">depuis la série 2</div>
      </div>
      <div class="digits">1:24</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:6px">
      <div class="sets-head"><span>#</span><span>Dernière fois</span><span style="text-align:right">kg</span><span style="text-align:right">Reps</span><span></span></div>
      <div class="set done"><span class="n">1</span><span class="prev">30 × 10</span><span class="v">30</span><span class="v">10</span><span class="check on"><svg class="i"><use href="#check"/></svg></span></div>
      <div class="set done"><span class="n">2</span><span class="prev">30 × 9</span><span class="v">30</span><span class="v">9</span><span class="check on"><svg class="i"><use href="#check"/></svg></span></div>

      <div class="current">
        <div class="row" style="justify-content:space-between">
          <span class="display" style="font-size:20px">SÉRIE 3</span>
          <span class="small muted">Dernière fois : <b style="color:var(--text)">27,5 × 10</b></span>
        </div>
        <div class="steppers">
          <div class="stepper"><span class="pm">−</span><span class="val"><b>30</b><small>kg</small></span><span class="pm">+</span></div>
          <div class="stepper" style="flex:.85"><span class="pm">−</span><span class="val"><b>9</b><small>reps</small></span><span class="pm">+</span></div>
        </div>
        <div class="btn primary"><svg class="i"><use href="#check"/></svg>Valider la série</div>
      </div>

      <div class="row" style="justify-content:center;height:40px;color:var(--text-2)" ><svg class="i s"><use href="#plus"/></svg><span class="small">Ajouter une série</span></div>
    </div>
  </div>

  <div class="sheet" style="height:92px;padding:0 16px">
    <div class="grabber"></div>
    <div class="row" style="margin-top:10px">
      <div class="grow">
        <div class="eyebrow" style="font-size:12px">Ensuite</div>
        <div class="bold">Écarté poulie vis-à-vis</div>
      </div>
      <span class="chip">5 exercices <svg class="i s"><use href="#up"/></svg></span>
    </div>
  </div>
  <div class="home-indicator"></div>

</div>
</body>
</html>
