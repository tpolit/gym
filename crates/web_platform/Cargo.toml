[package]
name = "web_platform"
description = "Adaptateurs navigateur de Gym (web-sys), sans Leptos."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
persistence.workspace = true
chrono.workspace = true
base64.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "DomException",
    "Element",
    "EventTarget",
    "File",
    "FileList",
    "HtmlAnchorElement",
    "HtmlElement",
    "HtmlInputElement",
    "Navigator",
    "ServiceWorkerContainer",
    "Storage",
    "Url",
    "VisibilityState",
    "Window",
] }

[dev-dependencies]
persistence = { workspace = true, features = ["contract-tests"] }
pollster.workspace = true

[lints]
workspace = true
