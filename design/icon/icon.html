<!DOCTYPE html>
<!-- Temporary app icon, until the final one.

<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face { font-family: "Barlow Condensed"; font-weight: 700; src: url(../../public/fonts/barlow-condensed-700.woff2) format("woff2"); }
      html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #0b0b0c; }
      svg { display: block; width: 100vw; height: 100vh; }

  <body>
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" fill="#0b0b0c" />

      <circle cx="50" cy="50" r="33" fill="none" stroke="#ffae80" stroke-width="7" stroke-linecap="round"
              stroke-dasharray="155.5 207.3" transform="rotate(-90 50 50)" />
      <text x="50" y="51" text-anchor="middle" dominant-baseline="central"
